name: Deploy

# Every push to main is tested, built and published to https://soil.joncackler.com/ with
# GitHub Pages (Pages source: GitHub Actions). Pull requests are checked by ci.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in push order. A newer push waits; it never cancels a deploy that is
# already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Engine tests (Vitest)
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests (Playwright)
        run: npm run test:e2e

      # Fails early with a clear message if Pages is not enabled for this repository.
      - uses: actions/configure-pages@v6

      # The site is served at the domain root, so Vite's base stays "/".
      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
