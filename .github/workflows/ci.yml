name: CI

# Typecheck and the engine tests once, then the browser tests on three engines, on every pull
# request. Deploy is a separate workflow (deploy.yml) that runs on pushes to main.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Engine tests (Vitest)
        run: npm test

  # One job per engine, all of e2e/ on each, so a new spec joins every engine by being added.
  # Chromium and Firefox run on Linux; WebKit runs on macOS, the closest to Safari that CI has.
  # No job cancels the others, so one pull request shows every engine's result, and the
  # workflow fails if any one of them fails.
  browser:
    name: Browser tests (${{ matrix.engine }}${{ matrix.copy }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: chromium, os: ubuntu-latest }
          - { engine: firefox, os: ubuntu-latest }
          - { engine: webkit, os: macos-latest, arm: measure, copy: 1 }
          - { engine: webkit, os: macos-latest, arm: measure, copy: 2 }
          - { engine: webkit, os: macos-latest, arm: measure, copy: 3 }
          - { engine: webkit, os: macos-latest, arm: magnifier, copy: 4 }
          - { engine: webkit, os: macos-latest, arm: magnifier, copy: 5 }
          - { engine: webkit, os: macos-latest, arm: magnifier, copy: 6 }
          - { engine: webkit, os: macos-latest, arm: log, copy: 7 }
          - { engine: webkit, os: macos-latest, arm: log, copy: 8 }
          - { engine: webkit, os: macos-latest, arm: log, copy: 9 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install ${{ matrix.engine }}
        run: npx playwright install --with-deps ${{ matrix.engine }}

      # Builds the production bundle, serves it with vite preview, and drives it in this engine.
      # A test that passes only on its retry fails the run (see failOnFlakyTests).
      - name: Browser tests (Playwright)
        if: matrix.engine == 'webkit'
        run: |
          # Temporary: the service worker install loop after the "${{ matrix.arm }}" specs.
          case "${{ matrix.arm }}" in
            log) FILES="e2e/log.spec.ts" ;;
            measure) FILES="e2e/measure.spec.ts" ;;
            magnifier) FILES="e2e/magnifier.spec.ts" ;;
          esac
          npx playwright test $FILES e2e/zz-sw-loop.spec.ts --project=webkit --retries=0 --workers=1 || true

      # Passed, skipped (with each reason), flaky and failed, on the run's summary page.
      - name: Summarize
        if: always()
        run: node scripts/e2e-summary.mjs e2e-results.json ${{ matrix.engine }} >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the Playwright report when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.engine }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
