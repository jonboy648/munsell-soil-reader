name: CI

# Typecheck, the engine tests and the browser tests on every pull request.
# Deploy is a separate workflow, added in its own ticket.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Engine tests (Vitest)
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds the production bundle, serves it with vite preview, and drives it in Chromium.
      - name: Browser tests (Playwright)
        run: npm run test:e2e

      - name: Keep the Playwright report when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
